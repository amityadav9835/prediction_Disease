{% extends "predictor/base.html" %}

{% block content %}
<section class="auth-shell reveal">
  <div class="auth-copy">
    <p class="eyebrow">Create Account</p>
    <h1>Start using AI Doctor.</h1>
    <p>Create a user account to access the prediction dashboard and ML screening forms.</p>
  </div>

  <form class="auth-form" method="post">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">
        <span>{{ field.label }}</span>
        {{ field }}
        {% for error in field.errors %}
          <small class="error">{{ error }}</small>
        {% endfor %}
      </label>
    {% endfor %}
    <button type="submit">Create Account</button>
    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </form>
</section>
{% endblock %}
